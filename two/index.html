<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Buon Compleanno, Papa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,500&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root{--green:#2F5D3A;--leaf:#2F7A45;--red:#B5523B;--flag:#C0392B;--gold:#C9A24B;--ink:#2B2A26;--brown:#6B5B3E;--cream:#FBF7F0;--paper:#FFFDF8;--line:#E6DDD0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--cream);color:var(--ink);font:500 21px/1.4 'Cormorant Garamond',Georgia,serif;-webkit-font-smoothing:antialiased}
.shell{min-height:100%;display:flex;flex-direction:column;max-width:680px;margin:0 auto;padding:0 18px calc(18px + env(safe-area-inset-bottom))}
.flag{height:7px;display:flex;margin:0 -18px}
.flag span{flex:1}.flag .g{background:var(--leaf)}.flag .w{background:#fff}.flag .r{background:var(--flag)}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 2px 6px;color:var(--brown);font-size:17px}
.dots{display:flex;gap:6px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line);transition:background .3s,transform .3s}
.dots i.on{background:var(--gold)}.dots i.now{background:var(--red);transform:scale(1.25)}
.card{flex:1;background:var(--paper);border:1.5px solid var(--gold);border-radius:6px;padding:26px 22px 22px;margin:8px 0 14px;box-shadow:0 1px 0 #fff inset,0 10px 30px -18px rgba(80,60,20,.35);position:relative}
.card:before{content:"";position:absolute;inset:5px;border:1px solid rgba(201,162,75,.35);border-radius:3px;pointer-events:none}
.step{display:none;animation:in .35s ease}
.step.show{display:block}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.kicker{font:600 13px 'Playfair Display',serif;letter-spacing:3px;text-transform:uppercase;color:var(--red);margin:0 0 6px}
h1{font:700 40px/1.08 'Playfair Display',serif;color:var(--green);margin:0 0 10px}
h2{font:600 29px/1.15 'Playfair Display',serif;color:var(--green);margin:0 0 6px}
.script{font-family:'Great Vibes',cursive;color:var(--red);font-size:46px;line-height:1;margin:4px 0 8px}
.hint{color:var(--brown);font-style:italic;margin:0 0 16px;font-size:19px}
p{margin:0 0 12px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;font:600 21px/1.25 'Cormorant Garamond',Georgia,serif;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;min-height:62px;cursor:pointer;transition:border-color .2s,background .2s,transform .1s}
.opt:active{transform:scale(.985)}
.opt .box{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid #CFC3AE;display:grid;place-items:center;transition:all .2s;background:#fff}
.opt.radio .box{border-radius:50%}
.opt .box svg{width:18px;height:18px;opacity:0;transform:scale(.5);transition:all .2s}
.opt[aria-pressed=true]{border-color:var(--leaf);background:#F3F8F3}
.opt[aria-pressed=true] .box{background:var(--leaf);border-color:var(--leaf)}
.opt[aria-pressed=true] .box svg{opacity:1;transform:none}
.opt small{display:block;font-weight:500;font-style:italic;color:var(--brown);font-size:17px}
textarea{width:100%;min-height:150px;font:500 21px/1.4 'Cormorant Garamond',Georgia,serif;color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:14px;background:#fff;resize:vertical}
textarea:focus,.opt:focus-visible,.btn:focus-visible{outline:3px solid rgba(47,122,69,.35);outline-offset:2px}
.nav{display:flex;gap:10px;padding-bottom:6px}
.btn{flex:1;font:600 20px 'Playfair Display',serif;border-radius:40px;padding:16px 18px;min-height:60px;border:0;cursor:pointer;transition:transform .1s,opacity .2s}
.btn:active{transform:scale(.98)}
.go{background:var(--green);color:#fff;box-shadow:0 6px 16px -8px rgba(47,93,58,.8)}
.back{flex:0 0 auto;background:transparent;color:var(--brown);border:1.5px solid var(--line);padding:16px 22px}
.btn[disabled]{opacity:.4}
.big{display:block;width:100%;margin:0 0 10px;text-decoration:none;text-align:center}
.red{background:var(--red);color:#fff}
.ghost{background:#fff;color:var(--green);border:1.5px solid var(--green)}
.sum{background:var(--cream);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:8px 0 16px;font-size:19px}
.sum b{font:600 13px 'Playfair Display',serif;letter-spacing:2px;text-transform:uppercase;color:var(--red);display:block;margin-top:10px}
.sum b:first-child{margin-top:0}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:30px;font-size:18px;opacity:0;transition:all .3s;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
.flourish{color:var(--gold);letter-spacing:8px;text-align:center;margin:6px 0 14px;font-size:14px}
.small{font-size:17px;color:var(--brown)}
.opt .em{flex:none;font-size:30px;width:36px;text-align:center;line-height:1}
.opts.chips{grid-template-columns:1fr 1fr;gap:8px}
.opts.chips .opt{min-height:54px;padding:10px 10px;font-size:18px;gap:8px}
.opts.chips .opt .em{font-size:22px;width:24px}
.opts.chips .opt .box{display:none}
.note{margin-top:14px}
.note textarea{min-height:80px;font-size:19px}
.note label{display:block;color:var(--brown);font-style:italic;font-size:18px;margin-bottom:6px}
.preview{margin:0 0 16px}
.casa{background:#F8F5EE;border:1.5px solid var(--line);border-radius:18px;overflow:hidden;font:400 14px/1.3 -apple-system,'Helvetica Neue',Arial,sans-serif;color:#222}
.casa .cb{background:#2F5D3A;color:#fff;font-weight:600;padding:9px 14px;display:flex;gap:18px}.casa .cb span{opacity:.7}
.casa .hi{text-align:center;font:700 22px -apple-system,'Helvetica Neue',Arial,sans-serif;margin:10px 0 2px}
.casa .wx{text-align:center;color:#555;margin-bottom:8px}
.casa .tiles{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:0 10px 12px}
.casa .t{background:#fff;border:1px solid #e4ddd0;border-radius:10px;padding:8px}.casa .t b{display:block;font-size:13.5px}
.phone{background:#fff;border:1.5px solid var(--line);border-radius:22px;padding:10px 10px 14px;font:400 15.5px/1.35 -apple-system,'Helvetica Neue',Arial,sans-serif;color:#111}
.phone .bar{display:flex;align-items:center;gap:8px;padding:2px 4px 8px;border-bottom:1px solid #eee;margin-bottom:10px;font-weight:600;font-size:14px}
.phone .av{width:26px;height:26px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.phone .tag{margin-left:auto;font-weight:500;font-size:12px;color:#888}
.bub{border-radius:18px 18px 18px 5px;padding:9px 12px;max-width:94%;margin-bottom:6px}
.bub.mine{margin-left:auto;border-radius:18px 18px 5px 18px;max-width:70%}
.twin{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.twin .phone{font-size:14px;padding:8px 8px 12px}
.twin .cap{text-align:center;font:600 17px 'Playfair Display',serif;color:var(--green);margin-top:6px}
.tg{background:#dfe9d6}.tg .bub{background:#fff}.tg .bub.mine{background:#e1fec6}
.im .bub{background:#e9e9eb}.im .bub.mine{background:#1f8bff;color:#fff}
@media print{
  body{background:#fff}.top,.nav,.flag,.noprint,.toast{display:none!important}
  .card{border:none;box-shadow:none;padding:0}.card:before{display:none}
  .step{display:none!important}.step.final{display:block!important}
}
</style>
</head>
<body>
<div class="shell">
  <div class="flag"><span class="g"></span><span class="w"></span><span class="r"></span></div>
  <div class="top"><span id="where">Benvenuto</span><div class="dots" id="dots"></div></div>
  <main class="card" id="card"></main>
  <div class="nav" id="nav">
    <button class="btn back" id="back" type="button">Back</button>
    <button class="btn go" id="next" type="button">Let's begin</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const MOM = new URLSearchParams(location.search).get("for")==="mom";
const P = MOM ? {name:"Mom", other:"Papa", key:"mom-survey2-v1", title:"Grazie, Mom", greet:"Grazie,", big:"Mom!",
  kick:"Part two",
  p1:"Thank you for your answers. James read every one, and they've already shaped the plan.",
  p2:"A few of them we'd like to get exactly right, so here are a few short questions, with pictures. About four minutes."}
 : {name:"Papa", other:"Mom", key:"papa-survey2-v1", title:"Grazie, Papa", greet:"Grazie,", big:"Papa!",
  kick:"Part two",
  p1:"Thank you for your answers. James read every one, and they've already shaped the plan.",
  p2:"A few of them we'd like to get exactly right, so here are a few short questions, with pictures. About six minutes."};
document.title = P.title;
const MORNING = `<div class="phone"><div class="bar"><span class="av">EZ</span>EZ<span class="tag">6:45 AM</span></div>
 <div class="bub">Good morning! ☀️ Sunny and 68° today.<br>• Dentist at 10:30<br>• Trash goes out tonight<br><br>"This is the day that the LORD has made; let us rejoice and be glad in it." Psalm 118:24</div></div>`;
const CHANNEL = `<div class="twin">
 <div><div class="phone tg"><div class="bar"><span class="av">EZ</span>EZ</div>
  <div class="bub">Good morning! Dentist at 10:30 today.</div><div class="bub mine">Thanks! Remind me at 10</div><div class="bub">Will do 👍</div></div>
  <div class="cap">Telegram</div></div>
 <div><div class="phone im"><div class="bar"><span class="av">EZ</span>EZ</div>
  <div class="bub">Good morning! Dentist at 10:30 today.</div><div class="bub mine">Thanks! Remind me at 10</div><div class="bub">Will do 👍</div></div>
  <div class="cap">Messages</div></div></div>`;
const CASA = `<div class="casa"><div class="cb">Texas house<span>California house</span></div>
 <div class="hi">Buongiorno!</div><div class="wx">⛅ Partly cloudy, 62°</div>
 <div class="tiles"><div class="t"><b>🚪 Front door</b>See who's there</div><div class="t"><b>🛡️ Alarm</b>Set or not, view only</div>
 <div class="t"><b>💊 Reminders</b>Pills, birthdays</div><div class="t"><b>🛒 Grocery list</b>Add as you go</div></div></div>`;
const ALL = [
 {id:"locks", who:"both", type:"one", kicker:"The door locks", title:"You'd like locking up made easy, but the helper should never control the locks. Which is closest?", hint:"Tap one.",
  opts:[["🔔","Text me at bedtime if a door is unlocked","I'll lock it myself"],["📱","Let me lock it from my phone","only when I tap, never on its own"],["🚪","Leave the locks out of it",""]]},
 {id:"garage", who:"papa", type:"one", kicker:"Your wish", title:"It's after 7 PM and the garage or gate is still open. What should happen?", hint:"Tap one.",
  opts:[["💬","Text me so I can close it",""],["🌙","Close it for me",""],["🌳","Nothing, I like it open at night",""]], note:"Anything else about the garage or gate?"},
 {id:"morning", who:"both", type:"one", kicker:"The good-morning text", title:"Here's a sample. Is it right?", hint:"Tap one.", preview:()=>MORNING,
  opts:[["👍","Just like this",""],["✂️","Shorter, please",""],["➕","Good, but add something","tell us below"]], note:"What would you add or change? (optional)"},
 {id:"when", who:"both", type:"one", kicker:"The good-morning text", title:"When should it arrive?", hint:"Tap one.",
  opts:[["🌅","Around 6 AM",""],["☕","Around 7 AM",""],["🍳","Around 8 AM",""]]},
 {id:"cal", who:"both", type:"many", kicker:"The day's plan", title:"The good-morning text lists your day. Where do your appointments live now?", hint:"Tap any.",
  opts:[["📱","The Calendar app on my iPhone",""],["📒","A paper calendar",""],["💭","In my head",""],["💑",`${P.other} keeps track of them`,""]], note:"Anything else? (for example, a shared calendar)"},
 {id:"headsup", who:"both", type:"many", kicker:"Heads-ups", title:"Which heads-ups would you want?", hint:"Tap any. James will tell you which ones the house can do.",
  opts:[["🚪","A door or the garage left open at night",""],["🔔","Someone at the front door",""],["📦","A package delivered",""],["🌡️","The house too hot or too cold",""],["⚡","The power went out",""]]},
 {id:"casa", who:"both", type:"one", kicker:"Casa, your home screen", title:"James is making you a home screen called Casa. It works on your phone, iPad or computer. How would you use it?", hint:"Here's a rough sample. Tap one.", preview:()=>CASA,
  opts:[["👀","I'd look at it most days",""],["👆","Now and then, when I need something",""],["🙅","I'd rather just get texts",""]]},
 {id:"casashow", who:"both", type:"many", max:4, chips:true, kicker:"Casa, your home screen", title:"What would you most want to see on it? Pick up to four.", hint:"We'll put these at the top.",
  opts:[["🌤️","Weather"],["🚪","Who's at the door"],["🛡️","Alarm on or off"],["🌡️","House temperature"],["📶","Wi-Fi working"],["🎵","Music on the soundbar"],["💊","Reminders"],["📅","Today's plan"],["🛒","Grocery list"],["📷","Photos of the grandkids"],["💬","A button to ask EZ"]], note:"Anything else you'd want on it?"},
 {id:"channel", who:"both", type:"one", kicker:"Where the texts come", title:"Your helper's texts could come in either of these. Which is fine with you?", hint:"Both work the same. Telegram is free, and James sets it up. Messages may cost a little each month, so James would check first.", preview:()=>CHANNEL,
  opts:[["✈️","Telegram is fine","set it up for me"],["💬","Only my Messages app",""],["🤷","Either one, James decides",""]]},
 {id:"talk", who:"papa", type:"one", kicker:"Talking to it", title:"You'd like to just say it, but it should never be listening. Which fits?", hint:"Tap one.",
  opts:[["🎙️","I record a voice message on my phone and send it",""],["🔘","I press a button, then talk",""],["⌨️","Typing is fine for now",""]]},
 {id:"first3", who:"papa", type:"many", max:3, chips:true, kicker:"Your list", title:"Pick the three you'd use first.", hint:"We'll start there and add the rest over time.",
  opts:[["🛒","Grocery list"],["✅","To-do list"],["📅","Calendar"],["🩺","Doctor visits"],["🚗","Car upkeep"],["🐕","Cooper's health"],["📧","Junk email"],["🏃","Exercise"],["🔨","Home projects"],["✈️","Trips"],["👨‍👩‍👧","Family follow-up"],["🎬","Movies"],["📚","Books"],["🌱","Growing: body, mind, spirit"]]},
 {id:"wish", who:"both", type:"text", kicker:"Last one", title:"Anything else James should know?", hint:"Write as little or as much as you like. You can skip this."}
];
const Q = ALL.filter(q=>q.who==="both"||q.who===(MOM?"mom":"papa"));
const LABEL = {locks:"Door locks",garage:"Garage after 7 PM",morning:"Morning text",when:"Morning text at",cal:"Appointments live in",headsup:"Heads-ups",casa:"Would use Casa",casashow:"On Casa",channel:"Texts come in",talk:"Talking",first3:"First three",wish:"Anything else"};
const KEY=P.key;
let A = {}; try{A=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
let i = -1; // -1 intro, 0..n-1 questions, n final
const card=document.getElementById("card"), next=document.getElementById("next"), back=document.getElementById("back"), dots=document.getElementById("dots"), where=document.getElementById("where");
const tick='<svg viewBox="0 0 20 20" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5l4 4 8-9"/></svg>';
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(A))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function intro(){return `<div class="step show">
 <div class="kicker">${P.kick}</div>
 <div class="script">${P.greet}</div>
 <h1>${P.big}</h1>
 <div class="flourish">✦ ✦ ✦</div>
 <p>${P.p1}</p>
 <p>${P.p2}</p>
 <p class="small">Nothing is sent anywhere until you choose to send it at the end.</p></div>`}

function question(q){
 let h=`<div class="step show"><div class="kicker">${q.kicker}</div><h2>${q.title}</h2><p class="hint">${q.hint}</p>`;
 if(q.preview)h+=`<div class="preview">${q.preview()}</div>`;
 if(q.type==="text"){h+=`<textarea id="t" placeholder="Type here…">${esc(A[q.id]||"")}</textarea>`}
 else{h+=`<div class="opts ${q.chips?"chips":""}">`+q.opts.map(o=>{const [e,t,s]=o;const on=q.type==="one"?A[q.id]===t:(A[q.id]||[]).includes(t);
   return `<button type="button" class="opt ${q.type==="one"?"radio":""}" aria-pressed="${on}" data-v="${esc(t)}"><span class="box">${tick}</span><span class="em">${e}</span><span>${esc(t)}${s?`<small>${esc(s)}</small>`:""}</span></button>`}).join("")+`</div>`;
  if(q.note)h+=`<div class="note"><label for="n">${esc(q.note)}</label><textarea id="n" placeholder="Type here…">${esc(A[q.id+"_note"]||"")}</textarea></div>`}
 return h+`</div>`}

function summaryText(){
 const d=new Date().toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"});
 let t=`${MOM?"Mom's answers, part two":"Papa's answers, part two"} (${d})\n`;
 for(const q of Q){const v=A[q.id],nt=(A[q.id+"_note"]||"").trim();if((!v||(Array.isArray(v)&&!v.length))&&!nt)continue;t+=`\n${LABEL[q.id]}: ${Array.isArray(v)?v.join("; "):(v||"")}${nt?` (note: ${nt})`:""}`}
 return t.trim()}
function summaryHTML(){
 let h="";for(const q of Q){const v=A[q.id],nt=(A[q.id+"_note"]||"").trim();if((!v||(Array.isArray(v)&&!v.length))&&!nt)continue;h+=`<b>${LABEL[q.id]}</b>${esc(Array.isArray(v)?v.join(" · "):(v||""))}${nt?`<br><i>${esc(nt)}</i>`:""}`}
 return h||"<i>No answers yet. Tap Back to go through the questions.</i>"}

function final(){return `<div class="step show final">
 <div class="kicker">Grazie mille</div>
 <h2>That's everything!</h2>
 <p class="hint">Here's what you told us. Send it to James and he'll take it from here.</p>
 <div class="sum">${summaryHTML()}</div>
 <div class="noprint">
  <button class="btn go big" id="share" type="button">Send to James</button>
  <button class="btn ghost big" id="copy" type="button">Copy my answers</button>
  <button class="btn ghost big" id="print" type="button">Save or print a copy</button>
  <div class="flourish">✦</div>
  <p class="small">Thank you, ${P.name}.</p>
 </div></div>`}

function render(){
 const n=Q.length;
 dots.innerHTML=Q.map((_,k)=>`<i class="${k<i?"on":k===i?"now":""}"></i>`).join("");
 where.textContent=i<0?"Benvenuto":i>=n?"Finito":`Question ${i+1} of ${n}`;
 card.innerHTML=i<0?intro():i>=n?final():question(Q[i]);
 back.style.display=i<0?"none":"";
 next.style.display=i>=n?"none":"";
 next.textContent=i<0?"Let's begin":i===n-1?(A.wish?"Finish":"Skip and finish"):"Next";
 if(i>=0&&i<n){
  const q=Q[i];
  const nb=document.getElementById("n");if(nb)nb.oninput=()=>{A[q.id+"_note"]=nb.value;save()};
  if(q.type==="text"){const t=document.getElementById("t");t.oninput=()=>{A.wish=t.value;save();next.textContent=t.value.trim()?"Finish":"Skip and finish"}}
  card.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
   const v=b.dataset.v;
   if(q.type==="one"){A[q.id]=v;card.querySelectorAll(".opt").forEach(x=>x.setAttribute("aria-pressed",x===b));save();if(!q.note)setTimeout(()=>{if(i<n&&Q[i]===q)go(1)},380);return}
   let arr=A[q.id]||[];
   if(arr.includes(v))arr=arr.filter(x=>x!==v);else{if(q.max&&arr.length>=q.max){toast(`Up to ${q.max}, please`);return}arr=[...arr,v]}
   A[q.id]=arr;b.setAttribute("aria-pressed",arr.includes(v));save()});
 }
 if(i>=n){
  document.getElementById("share").onclick=async()=>{const text=summaryText();
   if(navigator.share){try{await navigator.share({title:`${P.name}'s answers`,text});return}catch(e){if(e.name==="AbortError")return}}
   await copy(text);toast("Copied. Paste it into a text or email to James.")};
  document.getElementById("copy").onclick=async()=>{await copy(summaryText());toast("Copied. Paste it into a text or email.")};
  document.getElementById("print").onclick=()=>window.print();
 }
 window.scrollTo({top:0,behavior:"smooth"});
}
async function copy(t){try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();document.execCommand("copy");a.remove()}}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("on");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("on"),2600)}
function go(d){i=Math.max(-1,Math.min(Q.length,i+d));render()}
next.onclick=()=>go(1);back.onclick=()=>go(-1);
render();
</script>
</body>
</html>
